[project]
name = "reliable-light"
version = "0.1.1"
description = "Reliable command proxy lights for Home Assistant"
requires-python = ">=3.14.2"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["custom_components/reliable_light"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "C901",
  "D203",
  "D213",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "S311",
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN003", "ARG001", "PLR2004", "SLF001"]
